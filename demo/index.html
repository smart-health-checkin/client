<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Check-in</title>
<link rel="stylesheet" href="/assets/smart-design.css">
<script src="/assets/site-chrome.js" defer></script>
<style>
  /* This demo simulates a clinic's own page, drawn on the site's design
     system so the whole domain reads as one product family. Names below are
     the demo's local vocabulary, mapped onto the shared tokens. */
  :root {
    --ink:      var(--fg-1);
    --muted:    var(--fg-2);
    --accent:   var(--brand);
    --line:     var(--border);
    --code-bg:  var(--gray-100);
    --demo-bg:   var(--warning-wash);
    --demo-line: #E7C88F;
    --demo-ink:  #7A5A16;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg-alt);
    color: var(--ink);
    font-family: var(--font-sans);
    line-height: 1.55;
  }
  .wrap { max-width: 54rem; margin: 0 auto; padding: 0 var(--space-5); }

  /* the demo strip, its panel and its controls are the shared components;
     only the caret's behaviour is local to this toggle */
  .demo-toggle .caret { transition: transform 0.15s ease; font-size: 0.7rem; }
  .demo-toggle[aria-expanded="true"] .caret { transform: rotate(180deg); }

  .demo-panel .wrap { padding-top: var(--space-4); padding-bottom: var(--space-5); }
  .control-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
    gap: var(--space-4) var(--space-5);
  }
  .panel-foot {
    display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center;
    margin-top: var(--space-4); font-size: var(--fs-sm); color: var(--fg-3);
  }

  /* ---- clinic app ------------------------------------------------- */
  .clinic-header { background: var(--surface); border-bottom: 1px solid var(--line); }
  .clinic-header .wrap { padding-top: var(--space-4); padding-bottom: var(--space-4); display: flex; align-items: center; gap: var(--space-4); }
  .clinic-mark { color: var(--accent); flex: none; }
  .clinic-name { font-weight: 600; font-size: var(--fs-md); letter-spacing: var(--tracking-snug); }
  .clinic-sub { color: var(--fg-3); font-size: var(--fs-sm); }

  main { padding-top: var(--space-6); padding-bottom: var(--space-9); display: flex; flex-direction: column; gap: var(--space-5); }
  h2 { font-size: var(--fs-md); font-weight: 600; margin: 0 0 var(--space-2); letter-spacing: var(--tracking-snug); }
  p { margin: var(--space-2) 0; }
  .small { font-size: var(--fs-sm); }
  .muted { color: var(--muted); }

  #visit-context { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); font-size: var(--fs-sm); color: var(--fg-2); }
  #visit-context b { color: var(--ink); font-weight: 500; }

  ul.request-items { list-style: none; margin: var(--space-4) 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  ul.request-items li {
    border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-4);
    display: flex; gap: var(--space-3); align-items: baseline;
  }
  ul.request-items .item-title { font-weight: 600; }
  ul.request-items .item-summary { color: var(--fg-3); font-size: var(--fs-sm); margin-top: 2px; }
  /* .chip carries .smart-chip from the script; only placement is local */
  .chip { flex: none; margin-left: auto; }

  /* a split button: one control, divided — the halves are .smart-btn */
  .start-group { position: relative; display: inline-flex; margin-top: var(--space-4); }
  .start-group #start { border-radius: var(--radius-md) 0 0 var(--radius-md); }
  .start-group .caret {
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    border-left: 1px solid rgba(255, 255, 255, 0.35);
    padding: 10px 12px;
  }
  .responder-menu {
    position: absolute; top: calc(100% + var(--space-2)); left: 0; z-index: 20;
    min-width: 20rem; max-width: min(26rem, 90vw);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); padding: var(--space-1);
    display: flex; flex-direction: column;
  }
  .responder-item {
    font: inherit; text-align: left; background: none; border: none; cursor: pointer;
    border-radius: var(--radius-md); padding: var(--space-3); color: var(--fg-1);
    display: flex; flex-direction: column; gap: 2px;
  }
  .responder-item:hover:not([disabled]) { background: var(--gray-50); }
  .responder-item[aria-current="true"] { background: var(--brand-wash); box-shadow: inset 2px 0 0 var(--brand); }
  .responder-item[disabled] { opacity: 0.5; cursor: not-allowed; }
  .responder-item strong { font-size: var(--fs-sm); font-weight: 600; }
  .responder-item span { font-size: var(--fs-sm); color: var(--fg-3); line-height: 1.4; }

  .smart-note { margin-top: var(--space-4); }
  label.ack { display: flex; gap: var(--space-2); align-items: center; margin-top: var(--space-3); font-size: var(--fs-sm); }
  a { color: var(--accent); }

  .outcome-head { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
  .outcome-head h2 { font-size: var(--fs-lg); margin: 0; }

  /* the outcome pill is a .smart-chip; status only recolours it */
  #outcome-status[data-status="completed"] { border-color: #9BD9CB; color: #12705E; background: var(--success-wash); }
  #outcome-status[data-status="error"] { border-color: #F0B6B1; color: #A32A22; background: var(--danger-wash); }
  table.items { width: 100%; border-collapse: collapse; margin: var(--space-4) 0 var(--space-1); font-size: var(--fs-sm); }
  table.items th, table.items td { text-align: left; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); }
  table.items th { font-weight: 600; }
  /* .return-link carries .smart-btn.primary from the script */
  .return-link { margin-top: var(--space-4); }

  /* ---- developer detail ------------------------------------------- */
  section.dev > h2 {
    color: var(--fg-3); font-size: var(--fs-xs); letter-spacing: var(--tracking-caps);
    font-family: var(--font-mono); text-transform: uppercase; margin-bottom: var(--space-4);
  }
  details.artifact { border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: var(--space-2); background: var(--surface); }
  details.artifact summary {
    cursor: pointer; padding: var(--space-3) var(--space-4); font-size: var(--fs-sm);
    display: flex; align-items: center; gap: var(--space-3); list-style: none;
  }
  details.artifact summary::-webkit-details-marker { display: none; }
  details.artifact summary::before {
    content: "\25B8"; color: var(--fg-3); font-size: var(--fs-xs); flex: none; transition: transform 0.15s ease;
  }
  details.artifact[open] summary::before { transform: rotate(90deg); }
  details.artifact summary .label { flex: 1; min-width: 0; }
  details.artifact summary .tools { display: flex; gap: var(--space-1); flex: none; }
  /* summary buttons carry .smart-btn.sm.mono from the script */
  details.artifact pre {
    background: var(--gray-50); border-top: 1px solid var(--border); margin: 0;
    padding: var(--space-4); overflow: auto; max-height: 22rem;
    font-family: var(--font-mono); font-size: var(--fs-xs); line-height: 1.6;
  }
  .dev-links { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-4); }
  /* .dev-links a carries .smart-btn.sm.mono from the script */
</style>
</head>
<body>

<div class="demo-strip smart-banner">
  <div class="wrap smart-banner-inner">
    <span class="smart-chip warning">Demo</span>
    <span class="what grow">Fictional clinic, test data only.</span>
    <button class="demo-toggle smart-btn sm" id="demo-toggle" aria-expanded="false" aria-controls="demo-panel">
      Demo controls <span class="caret" aria-hidden="true">&#9662;</span>
    </button>
  </div>
</div>

<div class="demo-panel smart-banner" id="demo-panel" hidden>
  <div class="wrap">
    <div class="control-grid">
      <label class="control smart-field"><span class="lbl">Scenario</span><select class="smart-select" id="scenario-select"></select></label>
      <label class="control smart-field"><span class="lbl">Wallet registry</span><input class="smart-input" id="registry-input" placeholder="./wallets.json"></label>
      <label class="control smart-field"><span class="lbl">After the response</span><select class="smart-select" id="submit-select">
        <option value="none">keep it in the page</option>
        <option value="transaction">post to FHIR (transaction)</option>
        <option value="individual">post to FHIR (individual)</option>
      </select></label>
      <label class="control smart-field"><span class="lbl">Patient</span><input class="smart-input" id="patient-input"></label>
      <label class="control smart-field"><span class="lbl">Appointment</span><input class="smart-input" id="appointment-input"></label>
      <label class="control smart-field"><span class="lbl">FHIR base</span><input class="smart-input" id="fhir-input" placeholder="none — set one to post"></label>
      <label class="control smart-field"><span class="lbl">Return URL</span><input class="smart-input" id="return-input" placeholder="(none)"></label>
    </div>
    <div class="panel-foot">
      <button type="button" id="copy-link">Copy link to this setup</button>
      <span>Every change is written to the URL, so any configuration here is a shareable, reproducible link.</span>
    </div>
  </div>
</div>

<header class="clinic-header">
  <div class="wrap">
    <svg class="clinic-mark" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <rect x="1" y="1" width="32" height="32" rx="8" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M17 8 C 12 13, 9 17, 17 26 C 25 17, 22 13, 17 8 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="clinic-name">Evergreen Family Health</div>
      <div class="clinic-sub">Online check-in</div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="smart-panel">
    <div id="visit-context"></div>
  </section>

  <section class="smart-panel">
    <h2>Before your visit</h2>
    <p class="muted" id="purpose-line"></p>
    <ul class="request-items" id="request-items"></ul>
    <p class="muted small">
      You choose what to share. Your care team only receives what you approve.
    </p>
    <div class="start-group">
      <button id="start" class="smart-btn primary" disabled>Check in with your health app</button>
      <button id="responder-toggle" class="smart-btn primary caret" aria-expanded="false"
              aria-haspopup="menu" aria-label="Choose who answers">▾</button>
      <div id="responder-menu" class="responder-menu" role="menu" hidden></div>
    </div>
    <p class="smart-note" id="status-note"></p>
    <p class="smart-note warning" id="backend-note" hidden></p>
    <label class="ack" id="backend-ack-wrap" hidden>
      <input type="checkbox" id="backend-ack">
      I recognize this server and I am using test data only.
    </label>
  </section>

  <section class="smart-panel" id="outcome-section" hidden>
    <div class="outcome-head">
      <h2 id="outcome-headline"></h2>
      <span id="outcome-status" class="smart-chip"></span>
    </div>
    <div id="outcome-summary" class="muted"></div>
    <div id="explore"></div>
    <p class="muted small" id="outcome-note"></p>
    <div id="return-wrap"></div>
  </section>

  <section class="smart-panel quiet dev">
    <h2>DEVELOPER DETAIL</h2>
    <div id="artifacts"></div>
  </section>
</main>

<script type="module" src="./main.js"></script>
</body>
</html>
