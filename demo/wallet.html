<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/assets/smart-design.css">
<script src="/assets/site-chrome.js" defer></script>
<style>
  /* The wallet is a separate product; its brand accent (set by wallet.js
     from the wallet's registry entry) colors only its mark and checkboxes. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-alt); font-family: var(--font-sans); line-height: 1.5; }
  main { max-width: 26rem; margin: 0 auto; padding: 1.5rem 1.25rem 2.5rem; display: flex; flex-direction: column; gap: 1rem; }
  .wallet-brand { display: flex; align-items: center; gap: 0.6rem; }
  .wallet-brand svg { color: var(--wallet-accent, var(--brand)); flex: none; }
  .wallet-brand .smart-chip { margin-left: auto; }
  .wallet-name { font-weight: 600; font-size: 1rem; margin: 0; letter-spacing: 0; }
  .wallet-tag { color: var(--fg-3); font-size: 0.8rem; }
  .verifier { padding: 0.85rem 1rem; }
  .verifier .origin { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; color: var(--fg-1); word-break: break-all; }
  .verifier .label { color: var(--fg-3); font-size: 0.8rem; }
  .consent-title { font-size: 1.1rem; margin: 0.5rem 0 0.75rem; }
  .purpose { color: var(--fg-3); font-size: 0.92rem; margin: 0.15rem 0 0; }
  ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.6rem; }
  ul.items li { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0.8rem 0.95rem; }
  .item-top { display: flex; gap: 0.7rem; align-items: flex-start; }
  .item-top input { margin-top: 0.25rem; flex: none; width: 1.05rem; height: 1.05rem; accent-color: var(--wallet-accent, var(--brand)); }
  .item-title { font-weight: 500; }
  .item-summary, .item-preview { color: var(--fg-3); font-size: 0.85rem; }
  .item-preview { margin-top: 0.35rem; font-family: var(--font-mono); font-size: 0.78rem; }
  .actions { display: flex; gap: 0.6rem; margin-top: 0.35rem; }
  .actions .smart-btn { flex: 1; justify-content: center; }
  .note { color: var(--fg-3); font-size: 0.8rem; text-align: center; }
  .note a { color: var(--brand); }
</style>
</head>
<body>
<!-- Opened on its own (from the Demos menu), the wallet gets the compact
     tool bar and the footer, so it isn't a dead end. Opened by a check-in
     page, it is the wallet itself, a separate product: no site chrome. -->
<div data-smart-topbar="tool" data-tool-title="Demo wallet" id="site-bar"></div>
<script>if (window.opener) document.getElementById("site-bar").remove();</script>
<main id="main">
  <div class="wallet-brand">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
      <rect x="1" y="4" width="26" height="20" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M1 11 H27" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="21" cy="17.5" r="2" fill="currentColor"/>
    </svg>
    <div>
      <h1 class="wallet-name">Demo wallet</h1>
      <div class="wallet-tag">holds your records on this device</div>
    </div>
    <span class="smart-chip">Demo</span>
  </div>

  <div id="waiting" class="note">Waiting for a request…</div>

  <div id="consent" hidden>
    <h2 class="consent-title" data-testid="consent-heading">A website is asking for your health information</h2>
    <div class="verifier smart-panel">
      <div class="label">Website</div>
      <div class="origin" id="verifier-origin"></div>
    </div>
    <p class="purpose" id="purpose"></p>

    <ul class="items" id="items"></ul>

    <div class="actions">
      <button class="smart-btn" id="decline">Not now</button>
      <button class="smart-btn primary" id="share">Share selected</button>
    </div>
    <p class="note">You control every item. Nothing leaves this wallet unless you share it.</p>
  </div>

  <p class="smart-callout bad" id="error" hidden></p>
</main>
<div data-smart-footer id="site-foot"></div>
<script>if (window.opener) document.getElementById("site-foot").remove();</script>
<script type="module" src="./wallet.js"></script>
</body>
</html>
