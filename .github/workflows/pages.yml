name: Deploy Pages

# Served at smart-health-checkin.org/client/. The org site
# (smart-health-checkin.github.io) owns the apex and /assets/; GitHub mounts
# this repo beneath it by name, so SITE_BASE tells the build where it lives.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: scripts/fetch-fixtures.sh
      - run: bun test
      - run: bun run build
      - run: SITE_BASE=/client scripts/build-pages.sh
        env:
          # scripts/fetch-releases.sh reads the releases.
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
